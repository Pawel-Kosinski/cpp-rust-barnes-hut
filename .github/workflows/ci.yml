name: CI

on:
  push:
    branches: [main, softwarex]
    tags: ['v*']
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
      - name: Build Rust
        working-directory: nbody_rust
        run: cargo build --release --bins
      - name: Scientific and reproducibility tests
        if: runner.os == 'Linux'
        run: |
          bash scripts/smoke_test.sh --no-build
          bash scripts/test_summary_stats.sh
          bash scripts/numerical_regression.sh --no-build
          bash scripts/test_archive_runner.sh
