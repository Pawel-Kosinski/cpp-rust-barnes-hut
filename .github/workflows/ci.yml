name: CI

on:
  push:
    branches: [softwarex]
  pull_request:
    branches: [main]

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Build C++
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release && cmake --build build --config Release
      - name: Build Rust
        working-directory: nbody_rust
        run: cargo build --release --bins
      - name: Smoke and summary tests
        if: runner.os == 'Linux'
        run: |
          bash scripts/smoke_test.sh
          bash scripts/test_summary_stats.sh
